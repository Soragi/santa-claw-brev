name: Verify Santa Claw GB10
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    name: Application (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            arch: arm64
            scanner: arm64
            digest: e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080
          - runner: ubuntu-24.04
            arch: x64
            scanner: x64
            digest: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node -p 'process.platform + "/" + process.arch'
      - run: npm ci --ignore-scripts
      - run: node deploy/check-repository-hygiene.mjs
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=moderate
      - name: Scan committed history for secrets
        env:
          SCANNER_ARCH: ${{ matrix.scanner }}
          SCANNER_DIGEST: ${{ matrix.digest }}
        run: |
          curl --fail --silent --show-error --location "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_${SCANNER_ARCH}.tar.gz" -o /tmp/gitleaks.tar.gz
          echo "${SCANNER_DIGEST}  /tmp/gitleaks.tar.gz" | sha256sum --check
          mkdir -p /tmp/gitleaks-bin
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks-bin gitleaks
          /tmp/gitleaks-bin/gitleaks git . --redact --no-banner
